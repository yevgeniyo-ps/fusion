[package]
name = "fusion"
version = "0.2.4"
edition = "2021"
description = "A lightweight macOS IDE where a tab is a mix of repos"
license = "MIT"
repository = "https://github.com/yevgeniyo-ps/fusion"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
libc = "0.2"
notify-debouncer-mini = "0.8"
portable-pty = "0.9"
regex = "1"
uuid = { version = "1", features = ["v4"] }

# The release bundle: small and with no debug info.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
