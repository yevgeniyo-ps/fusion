<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fusion's icon: a black sphere lit from the upper left,
       on a full-bleed black square. macOS 26 trims a full square to its own icon shape;
       an icon with transparent corners gets a white plate behind it instead. -->
  <defs>
    <radialGradient id="sphere" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#2a2b30"/>
      <stop offset="55%" stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="#000000"/>
  <circle cx="512" cy="512" r="380" fill="url(#sphere)"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>
</svg>
